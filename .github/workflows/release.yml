name: release

on:
  push:
    tags:
      # SemVer tags without a prefix: 0.1.0, 1.2.3, 1.0.0-rc.1
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Static validation
        run: npm run validate

      - name: Build packages
        run: npm run build

      - name: Verify generated artifacts
        run: |
          set -euo pipefail
          for archive in dist/*/*.zip; do
            unzip -t "$archive"
          done
          node scripts/validate.mjs --require-dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/chrome/browser-word-filter-chrome.zip \
            dist/firefox/browser-word-filter-firefox.zip \
            --title "Browser Word Filter ${GITHUB_REF_NAME}" \
            --generate-notes
